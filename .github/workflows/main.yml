name: Validate Practical Record Links

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Student Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate URLs and Action Status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner; // Student's GitHub username
            
            let htmlContent = fs.readFileSync('index.html', 'utf8');

            // Regular expression to match program URLs in the table
            const urlRegex = /href="(https:\/\/([^.]+)\.github\.io\/([^/"]+)\/?)"/g;
            let match;

            while ((match = urlRegex.exec(htmlContent)) !== null) {
              const fullUrl = match[1];
              const linkUsername = match[2];
              const repoName = match[3];

              // 1. Verify Ownership
              if (linkUsername.toLowerCase() !== owner.toLowerCase()) {
                console.log(`❌ Ownership mismatch for ${fullUrl}: Belongs to ${linkUsername}, expected ${owner}`);
                continue;
              }

              // 2. Check GitHub Actions Run Status via GitHub API
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: owner,
                  repo: repoName,
                  per_page: 1
                });

                if (runs.data.workflow_runs.length > 0) {
                  const latestRun = runs.data.workflow_runs[0];
                  if (latestRun.conclusion === 'success') {
                    console.log(`✅ ${repoName}: Built successfully with GitHub Actions!`);
                  } else {
                    console.log(`⚠️ ${repoName}: GitHub Action failed or in progress (${latestRun.conclusion})`);
                  }
                }
              } catch (error) {
                console.log(`⚠️ Could not fetch workflow status for ${repoName}: ${error.message}`);
              }
            }

      - name: Auto-commit updated index if needed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Optional script step to replace mark placeholders in index.html and push changes back
